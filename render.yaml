services:
  - type: web
    name: scamsense-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm --workspace=server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
